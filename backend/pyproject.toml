[project]
name = "backend"
version = "0.1.0"
description = "Asynchronous electronics shop management API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aerich>=0.10.1",
    "arabic-reshaper>=3.1.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "python-bidi>=0.6.12",
    "reportlab>=5.1.0",
    "tortoise-orm>=1.1.9",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.aerich]
tortoise_orm = "app.db.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
